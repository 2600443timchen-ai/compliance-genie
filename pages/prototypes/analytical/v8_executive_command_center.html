<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Risk Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#C5A059', deepblue: '#1E3A8A', slate900: '#0f172a', slate950: '#020617' }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }
        .outfit { font-family: 'Outfit', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .radar-pulse { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 
            70% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
        }
        
        .highlight-text { background-color: rgba(239, 68, 68, 0.3); color: #fca5a5; font-weight: bold; border-radius: 2px; padding: 0 4px; transition: all 0.3s; }
        .active-word { background-color: rgba(197, 160, 89, 0.4); border-bottom: 2px solid #C5A059; transition: all 0.1s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Data
        const CLUSTERS = [
            { id: 'c1', name: '結構債異常銷售', count: 128, severity: 'critical', trend: '+300%', riskValue: 'NT$ 4,500 萬' },
            { id: 'c2', name: '信用卡重複扣款', count: 85, severity: 'warning', trend: '+45%', riskValue: 'NT$ 120 萬' },
            { id: 'c3', name: '房貸利率爭議', count: 24, severity: 'normal', trend: '-5%', riskValue: 'NT$ 800 萬' },
            { id: 'c4', name: '高齡保單疑慮', count: 67, severity: 'high', trend: '+12%', riskValue: 'NT$ 2,200 萬' }
        ];

        const TRANSCRIPT = [
            { time: 0, text: "業務員：林太太您好，這檔真富貴結構債現在買非常划算喔。" },
            { time: 3, text: "客戶：可是我聽說會有虧損的風險？" },
            { time: 6, text: "業務員：您放心，這個是", isViolation: false },
            { time: 8, text: "保證獲利", isViolation: true, violationRule: "金保法第9條：禁止不實承諾獲利" },
            { time: 9, text: "的，而且", isViolation: false },
            { time: 10, text: "絕對保本", isViolation: true, violationRule: "金保法第9條：禁止不實承諾保本" },
            { time: 11, text: "，不會有任何本金損失的風險。" },
            { time: 14, text: "客戶：喔喔，保證獲利那我就放心了，幫我買個五百萬吧。" }
        ];

        // Components
        function Header() {
            return (
                <header className="flex justify-between items-center px-8 py-4 bg-slate-900 border-b border-slate-800">
                    <div className="flex items-center gap-4">
                        <div className="outfit text-2xl font-extrabold text-gold tracking-wider">EXEC RISK COMMAND</div>
                        <div className="h-6 w-px bg-slate-700"></div>
                        <div className="text-sm text-slate-400">Systemic Risk Radar Active</div>
                    </div>
                    <div className="flex items-center gap-6">
                        <div className="flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                            <span className="text-sm font-semibold text-red-500">LiveKit Stream Connected</span>
                        </div>
                        <div className="text-sm font-medium">Chief Risk Officer (CRO)</div>
                    </div>
                </header>
            );
        }

        function Heatmap({ onSelect }) {
            return (
                <div className="p-8 h-full flex flex-col">
                    <h2 className="outfit text-2xl mb-6 text-slate-300">全局曝險雷達 (Risk Clustering Heatmap)</h2>
                    <p className="text-slate-400 mb-8">透過 MongoDB Vector Search 將萬筆進件動態分群。點擊異常熱點進行深度穿透分析。</p>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6 flex-1">
                        {CLUSTERS.map(cluster => (
                            <div 
                                key={cluster.id} 
                                onClick={() => onSelect(cluster)}
                                className={`cursor-pointer rounded-xl border p-6 flex flex-col justify-between transition-all duration-300 hover:scale-105
                                    ${cluster.severity === 'critical' ? 'bg-red-950/40 border-red-500 radar-pulse' : 
                                      cluster.severity === 'warning' ? 'bg-orange-950/30 border-orange-500/50 hover:border-orange-500' : 
                                      cluster.severity === 'high' ? 'bg-rose-950/30 border-rose-500/50 hover:border-rose-500' :
                                      'bg-slate-900 border-slate-700 hover:border-slate-500'}`}
                            >
                                <div>
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="text-2xl font-bold outfit">{cluster.count} <span className="text-sm font-normal text-slate-400">件</span></div>
                                        <div className={`text-sm font-bold ${cluster.severity === 'critical' ? 'text-red-400' : 'text-slate-400'}`}>{cluster.trend}</div>
                                    </div>
                                    <div className="text-lg font-semibold mb-1">{cluster.name}</div>
                                    <div className="text-sm text-slate-400">潛在曝險: {cluster.riskValue}</div>
                                </div>
                                <div className="mt-6 text-right">
                                    <span className="text-sm text-gold">Drill Down →</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Workspace({ cluster, onBack }) {
            const [currentTime, setCurrentTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [activeViolation, setActiveViolation] = useState(null);
            
            // Simulation of LiveKit stream time update
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentTime(t => {
                            if(t >= 15) { setIsPlaying(false); return 0; }
                            return t + 0.2;
                        });
                    }, 200);
                }
                return () => clearInterval(interval);
            }, [isPlaying]);

            // Sync Transcript & Trigger RAG
            useEffect(() => {
                const currentSegments = TRANSCRIPT.filter(s => s.time <= currentTime);
                const latestSegment = currentSegments[currentSegments.length - 1];
                
                if (latestSegment && latestSegment.isViolation) {
                    setActiveViolation(latestSegment.violationRule);
                } else {
                    setActiveViolation(null);
                }
            }, [currentTime]);

            return (
                <div className="h-full flex flex-col bg-slate-950">
                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="text-slate-400 hover:text-white px-3 py-1 border border-slate-700 rounded">&lt; Radar</button>
                            <h2 className="outfit text-xl font-bold">{cluster.name} <span className="text-red-500 ml-2">Anomaly Detected</span></h2>
                        </div>
                        <div className="text-sm text-slate-400">LiveKit Audio Stream + RAG Engine Active</div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Evidence Viewer */}
                        <div className="flex-1 border-r border-slate-800 flex flex-col p-6">
                            <h3 className="text-gold font-semibold mb-4 flex items-center gap-2">
                                🎙️ 全息證據檢視器 (Holographic Evidence Viewer)
                            </h3>
                            
                            {/* Player Mock */}
                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 mb-6 flex items-center gap-4">
                                <button 
                                    onClick={() => setIsPlaying(!isPlaying)}
                                    className="w-12 h-12 rounded-full bg-gold text-slate-900 flex justify-center items-center font-bold text-xl hover:bg-yellow-500 transition-colors"
                                >
                                    {isPlaying ? '||' : '▶'}
                                </button>
                                <div className="flex-1">
                                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                                        <div className="h-full bg-gold transition-all duration-200" style={{width: `${(currentTime/15)*100}%`}}></div>
                                    </div>
                                </div>
                                <div className="text-sm font-mono text-slate-400">
                                    00:{(Math.floor(currentTime)).toString().padStart(2, '0')} / 00:15
                                </div>
                            </div>

                            {/* Transcript Sync */}
                            <div className="flex-1 bg-slate-900/50 p-6 rounded-lg border border-slate-800 overflow-y-auto leading-relaxed text-lg">
                                {TRANSCRIPT.map((item, idx) => {
                                    const isPassed = currentTime >= item.time;
                                    const isActive = isPassed && (idx === TRANSCRIPT.length - 1 || currentTime < TRANSCRIPT[idx+1].time);
                                    
                                    return (
                                        <span 
                                            key={idx} 
                                            className={`transition-colors duration-200 
                                                ${!isPassed ? 'text-slate-600' : 'text-slate-200'}
                                                ${item.isViolation && isPassed ? 'highlight-text' : ''}
                                                ${isActive ? 'active-word' : ''}
                                            `}
                                        >
                                            {item.text}
                                        </span>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Orchestration & RAG Panel */}
                        <div className="w-[450px] bg-slate-900 p-6 flex flex-col overflow-y-auto">
                            {/* RAG Alert Popup */}
                            <div className={`transition-all duration-300 transform ${activeViolation ? 'translate-y-0 opacity-100 mb-6' : '-translate-y-4 opacity-0 h-0 overflow-hidden'}`}>
                                <div className="bg-red-950/50 border-l-4 border-red-500 p-4 rounded-r">
                                    <div className="text-red-400 font-bold mb-1 flex items-center gap-2">
                                        ⚠️ AI 法規阻斷觸發 (RAG Alert)
                                    </div>
                                    <div className="text-sm text-slate-200">{activeViolation}</div>
                                </div>
                            </div>

                            <h3 className="text-gold font-semibold mb-6 mt-4">⚡ 戰略調度中樞 (Orchestration Hub)</h3>
                            
                            <div className="space-y-6">
                                {/* System Block Action */}
                                <div className="bg-slate-950 p-5 rounded-lg border border-slate-800 shadow-xl">
                                    <div className="font-semibold mb-1 text-slate-200">系統級閘道控制</div>
                                    <div className="text-xs text-slate-500 mb-4">即時中斷異常產品線的線上交易閘道</div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-sm">結構債線上申購閘道</span>
                                        <button 
                                            onClick={(e) => { e.target.innerText = 'PAUSED'; e.target.classList.add('bg-red-500', 'text-white'); e.target.classList.remove('bg-green-500'); }}
                                            className="px-4 py-1 bg-green-500 text-slate-900 text-sm font-bold rounded-full transition-colors"
                                        >
                                            ACTIVE
                                        </button>
                                    </div>
                                </div>

                                {/* Dynamic Threshold Action */}
                                <div className="bg-slate-950 p-5 rounded-lg border border-slate-800 shadow-xl">
                                    <div className="font-semibold mb-1 text-slate-200">風險閾值熱更新 (MongoDB)</div>
                                    <div className="text-xs text-slate-500 mb-4">動態調整全網高齡客戶警示年齡</div>
                                    <input type="range" min="60" max="75" defaultValue="70" className="w-full accent-gold mb-2" onInput={(e) => document.getElementById('age-val').innerText = e.target.value} />
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">目前設定: <span id="age-val" className="text-gold font-bold">70</span> 歲</span>
                                        <button className="text-gold hover:underline text-sm" onClick={() => alert('API Call: PUT /api/config/thresholds\n參數已更新並套用至全網。')}>Apply</button>
                                    </div>
                                </div>

                                {/* Cross-department Jira Ticket */}
                                <div className="bg-slate-950 p-5 rounded-lg border border-slate-800 shadow-xl">
                                    <div className="font-semibold mb-1 text-slate-200">跨部門重大事故派令</div>
                                    <div className="text-xs text-slate-500 mb-4">直接將此音軌與法規衝突證據寫入 Jira</div>
                                    <button 
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded transition-colors"
                                        onClick={(e) => { e.target.innerText = '✅ Ticket SEC-9942 Created'; e.target.classList.add('bg-green-600'); e.target.classList.remove('bg-blue-600'); }}
                                    >
                                        Create Jira Epic (Highest Prio)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [selectedCluster, setSelectedCluster] = useState(null);

            return (
                <div className="h-screen flex flex-col">
                    <Header />
                    <main className="flex-1 overflow-hidden relative">
                        {selectedCluster ? (
                            <Workspace cluster={selectedCluster} onBack={() => setSelectedCluster(null)} />
                        ) : (
                            <Heatmap onSelect={setSelectedCluster} />
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
